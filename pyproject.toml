[project]
name = "importarr"
version = "0.1.0"
description = "Sidecar that triages Lidarr auto-import failures: retries, LLM-assisted manual import, optional delete/blacklist"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apprise>=1.7",
    "mutagen>=1.47",
]

[project.scripts]
importarr = "importarr.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["importarr*"]
